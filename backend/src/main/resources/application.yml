server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: payroll-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/payroll?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:payroll}
    password: ${DB_PASSWORD:payroll}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-local-development-secret-key}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@payroll.local}
    admin-password: ${ADMIN_PASSWORD:Admin@123}
