services:
  mysql:
    image: mysql:8.4
    container_name: payroll-mysql
    environment:
      MYSQL_DATABASE: payroll
      MYSQL_USER: payroll
      MYSQL_PASSWORD: payroll
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: payroll-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/payroll?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: payroll
      DB_PASSWORD: payroll
      JWT_SECRET: local-compose-secret-key-local-compose-secret-key
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: payroll-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
